<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interaction slot</title>
<style>
  :root {
    --paper: #f3f2ef;
    --ink: #0a0a0a;
    --rule: rgba(10, 10, 10, 0.14);
    --muted: #777777;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: ui-sans-serif, system-ui, "Helvetica Neue", Arial, sans-serif;
    overflow: hidden;
  }
  canvas { display: block; width: 100%; height: 100%; touch-action: manipulation; }
  .label {
    position: absolute;
    left: clamp(14px, 2.4vw, 26px);
    bottom: clamp(12px, 2vw, 22px);
    margin: 0;
    font-family: ui-monospace, "IBM Plex Mono", Menlo, Consolas, monospace;
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    pointer-events: none;
  }
  .hint {
    position: absolute;
    right: clamp(14px, 2.4vw, 26px);
    bottom: clamp(12px, 2vw, 22px);
    margin: 0;
    font-family: ui-monospace, "IBM Plex Mono", Menlo, Consolas, monospace;
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    pointer-events: none;
  }
</style>
</head>
<body>
<canvas id="stage" aria-label="An interaction test: the rings follow the pointer, a click leaves a ripple. Arrow keys move the centre, space adds a ripple."></canvas>
<p class="label">Interaction slot</p>
<p class="hint">Move · Click · Arrows · Space</p>
<script>
(function () {
  const canvas = document.getElementById("stage");
  const ctx = canvas.getContext("2d");
  const reduced = window.matchMedia("(prefers-reduced-motion: reduce)");

  let w = 0, h = 0, dpr = 1;
  let pointer = { x: 0.5, y: 0.5 };
  let target = { x: 0.5, y: 0.5 };
  const ripples = [];
  let frame = 0;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    const rect = canvas.getBoundingClientRect();
    w = Math.max(rect.width, 1);
    h = Math.max(rect.height, 1);
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw(performance.now());
  }

  function drawGrid() {
    ctx.clearRect(0, 0, w, h);
    ctx.strokeStyle = "rgba(10,10,10,0.07)";
    ctx.lineWidth = 1;
    const step = w > 900 ? 96 : 64;
    for (let x = step; x < w; x += step) {
      ctx.beginPath(); ctx.moveTo(x + 0.5, 0); ctx.lineTo(x + 0.5, h); ctx.stroke();
    }
    for (let y = step; y < h; y += step) {
      ctx.beginPath(); ctx.moveTo(0, y + 0.5); ctx.lineTo(w, y + 0.5); ctx.stroke();
    }
  }

  function drawRings(t) {
    const cx = pointer.x * w;
    const cy = pointer.y * h;
    const maxR = Math.min(w, h) * 0.42;
    ctx.lineWidth = 1;
    for (let i = 0; i < 9; i++) {
      const base = maxR * (0.22 + i * 0.09);
      const breathe = reduced.matches ? 0 : Math.sin(t * 0.0006 + i * 0.7) * 2;
      ctx.strokeStyle = "rgba(10,10,10," + (0.34 - i * 0.026) + ")";
      ctx.beginPath();
      ctx.arc(cx, cy, base + breathe, 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.strokeStyle = "rgba(10,10,10,0.5)";
    ctx.beginPath();
    ctx.moveTo(cx - 9, cy); ctx.lineTo(cx + 9, cy);
    ctx.moveTo(cx, cy - 9); ctx.lineTo(cx, cy + 9);
    ctx.stroke();
  }

  function drawRipples(t) {
    ctx.strokeStyle = "rgba(10,10,10,0.28)";
    ctx.lineWidth = 1;
    for (let i = ripples.length - 1; i >= 0; i--) {
      const r = ripples[i];
      const age = (t - r.t) / 900;
      if (age >= 1) { ripples.splice(i, 1); continue; }
      ctx.globalAlpha = 1 - age;
      ctx.beginPath();
      ctx.arc(r.x, r.y, 8 + age * Math.min(w, h) * 0.36, 0, Math.PI * 2);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
  }

  function draw(t) {
    drawGrid();
    drawRings(t);
    drawRipples(t);
  }

  function loop(t) {
    pointer.x += (target.x - pointer.x) * 0.08;
    pointer.y += (target.y - pointer.y) * 0.08;
    draw(t);
    frame = requestAnimationFrame(loop);
  }

  function start() {
    cancelAnimationFrame(frame);
    if (reduced.matches) { pointer = { ...target }; draw(performance.now()); }
    else frame = requestAnimationFrame(loop);
  }

  function ripple(x, y) {
    ripples.push({ x, y, t: performance.now() });
    if (reduced.matches) draw(performance.now());
  }

  canvas.addEventListener("pointermove", (e) => {
    const rect = canvas.getBoundingClientRect();
    target = { x: (e.clientX - rect.left) / rect.width, y: (e.clientY - rect.top) / rect.height };
  });

  canvas.addEventListener("pointerdown", (e) => {
    const rect = canvas.getBoundingClientRect();
    ripple(e.clientX - rect.left, e.clientY - rect.top);
  });

  canvas.tabIndex = 0;
  canvas.addEventListener("keydown", (e) => {
    const step = 0.04;
    if (e.key === "ArrowLeft") target.x = clamp(target.x - step);
    else if (e.key === "ArrowRight") target.x = clamp(target.x + step);
    else if (e.key === "ArrowUp") target.y = clamp(target.y - step);
    else if (e.key === "ArrowDown") target.y = clamp(target.y + step);
    else if (e.key === " ") ripple(target.x * w, target.y * h);
    else return;
    e.preventDefault();
    if (reduced.matches) { pointer = { ...target }; draw(performance.now()); }
  });

  function clamp(v) { return Math.min(1, Math.max(0, v)); }

  reduced.addEventListener("change", start);
  window.addEventListener("resize", resize);
  resize();
  start();
})();
</script>
</body>
</html>
